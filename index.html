<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Sólidos Geométricos en RA</title>

  <!--
    ═══════════════════════════════════════════════════════════════════
    LIBRERÍAS PRINCIPALES
    ─────────────────────────────────────────────────────────────────
    • A-Frame 1.5.0: motor de escenas 3D/WebXR basado en Three.js.
      Permite declarar objetos 3D con etiquetas HTML personalizadas.
    • AR.js (aframe-ar): capa de Realidad Aumentada para A-Frame.
      Detecta marcadores fiduciales (Hiro, Kanji, etc.) mediante la
      cámara del dispositivo y ancla la escena 3D sobre ellos.
    ═══════════════════════════════════════════════════════════════════
  -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    /* ═══════════════════════════════════════════════════════════════
       RESET Y BASE
       Eliminamos márgenes por defecto y fijamos el fondo en negro
       para que la cámara ocupe toda la pantalla sin franjas blancas.
    ═══════════════════════════════════════════════════════════════════ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      overflow: hidden;           /* Evita barras de scroll en el body        */
      background: #000;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    /* ═══════════════════════════════════════════════════════════════
       PANEL DE CONTROL (UI FLOTANTE)
       Posicionado en la parte inferior con z-index alto para quedar
       siempre visible sobre la vista de cámara de AR.js.
       overflow-y: auto activa scroll vertical automático si los
       botones superan la altura máxima del panel (max-height).
    ═══════════════════════════════════════════════════════════════════ */
    #menu-panel {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 9999;

      /* Fondo semitransparente tipo "glassmorphism" para no bloquear la cámara */
      background: rgba(10, 10, 30, 0.82);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-top: 2px solid rgba(255, 255, 255, 0.15);

      padding: 12px 16px 16px;

      /* ── Scroll responsivo ──────────────────────────────────────
         max-height limita la altura del panel al 40 % de la
         ventana. Si los botones o futuros sólidos adicionales
         superan ese límite, overflow-y: auto muestra un scrollbar
         vertical de forma automática, garantizando que ningún
         botón quede oculto o recortado.
      ─────────────────────────────────────────────────────────── */
      max-height: 40vh;
      overflow-y: auto;
      overflow-x: hidden;
    }

    /* Título del panel */
    #menu-panel h2 {
      color: #e0e8ff;
      font-size: clamp(0.75rem, 2.5vw, 1rem);
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 10px;
      text-align: center;
      opacity: 0.85;
    }

    /* ── Cuadrícula de botones ───────────────────────────────────
       CSS Grid con columnas automáticas de mínimo 120 px.
       Esto hace que en móviles se creen 2 columnas y en
       tablets/PCs aparezcan más, sin necesidad de media-queries.
    ─────────────────────────────────────────────────────────── */
    #botones-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 10px;
    }

    /* ── Botones individuales ───────────────────────────────────
       Mínimo de 44 × 44 px para cumplir criterios de accesibilidad
       táctil (WCAG 2.5.5). El tamaño de fuente usa clamp() para
       adaptarse a diferentes densidades de pantalla.
    ─────────────────────────────────────────────────────────── */
    .btn-solido {
      min-height: 48px;
      padding: 10px 8px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-size: clamp(0.7rem, 2.2vw, 0.9rem);
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      text-shadow: 0 1px 3px rgba(0,0,0,0.5);
    }

    .btn-solido span.emoji { font-size: 1.4em; }

    /* Colores diferenciados por sólido (refuerzo visual/pedagógico) */
    .btn-solido[data-solido="cubo"]     { background: linear-gradient(135deg, #e63946, #c1121f); }
    .btn-solido[data-solido="esfera"]   { background: linear-gradient(135deg, #2196f3, #0d47a1); }
    .btn-solido[data-solido="cilindro"] { background: linear-gradient(135deg, #4caf50, #1b5e20); }
    .btn-solido[data-solido="cono"]     { background: linear-gradient(135deg, #ff9800, #e65100); }

    /* Estado activo: borde blanco brillante + sombra de color */
    .btn-solido.activo {
      outline: 3px solid #fff;
      outline-offset: 2px;
      transform: scale(1.05);
      box-shadow: 0 0 16px rgba(255,255,255,0.4);
    }

    /* Hover/focus para accesibilidad */
    .btn-solido:hover  { opacity: 0.88; transform: scale(1.03); }
    .btn-solido:active { transform: scale(0.97); }

    /* ── Badge de sólido activo ────────────────────────────────── */
    #badge-activo {
      position: fixed;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      background: rgba(10, 10, 30, 0.78);
      backdrop-filter: blur(8px);
      border: 1.5px solid rgba(255,255,255,0.2);
      border-radius: 999px;
      padding: 6px 18px;
      color: #fff;
      font-size: clamp(0.65rem, 2vw, 0.85rem);
      font-weight: 600;
      letter-spacing: 0.06em;
      white-space: nowrap;
      pointer-events: none;
    }

    /* ── Instrucción de marcador ──────────────────────────────── */
    #instruccion {
      position: fixed;
      top: 54px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9998;
      color: rgba(255,255,255,0.6);
      font-size: clamp(0.55rem, 1.8vw, 0.75rem);
      text-align: center;
      pointer-events: none;
      white-space: nowrap;
    }
  </style>
</head>

<body>

  <!-- ════════════════════════════════════════════════════════════════
       BADGE E INSTRUCCIÓN (siempre visibles sobre la cámara)
  ════════════════════════════════════════════════════════════════════ -->
  <div id="badge-activo">▶ CUBO</div>
  <div id="instruccion">Apunta la cámara al marcador HIRO</div>

  <!-- ════════════════════════════════════════════════════════════════
       PANEL DE CONTROL — MENÚ CON SCROLL AUTOMÁTICO
       Los botones llaman a cambiarSolido(nombre) al pulsarlos.
  ════════════════════════════════════════════════════════════════════ -->
  <div id="menu-panel">
    <h2>🔷 Sólidos Geométricos</h2>
    <div id="botones-container">

      <!--
        Cada botón tiene data-solido con el identificador interno
        del sólido. Al añadir nuevos sólidos en el futuro, basta
        con agregar un botón aquí y el elemento A-Frame correspondiente;
        el scroll se activará automáticamente si el panel se llena.
      -->
      <button class="btn-solido activo"
              data-solido="cubo"
              onclick="cambiarSolido('cubo')">
        <span class="emoji">🟥</span>Cubo
      </button>

      <button class="btn-solido"
              data-solido="esfera"
              onclick="cambiarSolido('esfera')">
        <span class="emoji">🔵</span>Esfera
      </button>

      <button class="btn-solido"
              data-solido="cilindro"
              onclick="cambiarSolido('cilindro')">
        <span class="emoji">🟢</span>Cilindro
      </button>

      <button class="btn-solido"
              data-solido="cono"
              onclick="cambiarSolido('cono')">
        <span class="emoji">🟠</span>Cono
      </button>

      <!--
        ════════════════════════════════════════════════════════════
        ZONA DE EXPANSIÓN FUTURA
        Para agregar más sólidos (pirámide, prisma, etc.) simplemente
        copia el patrón de botón de arriba y añade el elemento en
        la escena A-Frame. El grid y el scroll se adaptan solos.
        ════════════════════════════════════════════════════════════
      -->

    </div>
  </div>

  <!-- ════════════════════════════════════════════════════════════════
       ESCENA A-FRAME + AR.js
       ────────────────────────────────────────────────────────────────
       Atributos clave de <a-scene>:
       • embedded            → integra la escena como elemento HTML
                               (necesario para la UI flotante)
       • arjs               → activa AR.js; sourceType=webcam usa la
                               cámara del dispositivo; debugUIEnabled=false
                               oculta el panel de depuración de AR.js;
                               detectionMode=mono_and_matrix optimiza la
                               detección en dispositivos móviles;
                               patternRatio=0.75 mejora la robustez con
                               el marcador impreso.
       • vr-mode-ui="enabled:false" → deshabilita el botón VR estándar
                               que A-Frame muestra por defecto.
       • renderer           → logarithmicDepthBuffer evita z-fighting
                               (artefactos de superposición de superficies).
  ════════════════════════════════════════════════════════════════════ -->
  <a-scene
    embedded
    arjs="sourceType: webcam;
          debugUIEnabled: false;
          detectionMode: mono_and_matrix;
          patternRatio: 0.75;"
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true; antialias: true;"
    loading-screen="dotsColor: white; backgroundColor: black">

    <!--
      ── ASSETS ───────────────────────────────────────────────────
      A-Frame preloading de activos. Aquí se pueden agregar texturas
      o modelos externos si en el futuro se enriquece la app.
    -->
    <a-assets></a-assets>

    <!-- ══════════════════════════════════════════════════════════
         MARCADOR HIRO
         <a-marker> detecta el patrón Hiro (incluido por defecto en
         AR.js). Todos los sólidos son hijos del marcador, por lo
         que se posicionan y rotan automáticamente sobre él.
         smooth="true" y smoothCount/Threshold/Tolerance reducen el
         temblor (jitter) de la escena cuando el marcador se detecta.
    ══════════════════════════════════════════════════════════════ -->
    <a-marker
      preset="hiro"
      smooth="true"
      smoothCount="10"
      smoothTolerance="0.01"
      smoothThreshold="5">

      <!--
        ════════════════════════════════════════════════════════════
        ESCALA GLOBAL
        Todos los sólidos están dentro de este <a-entity> con
        scale="0.4 0.4 0.4". Esto hace que las figuras queden
        contenidas dentro del marcador impreso (≈ 9×9 cm) sobre
        una mesa escolar, sin sobresalir visualmente.
        position="0 0.5 0" levanta levemente el grupo para que la
        figura parezca "flotar" encima del marcador.
        ════════════════════════════════════════════════════════════
      -->
      <a-entity
        id="grupo-solidos"
        position="0 0.5 0"
        scale="0.4 0.4 0.4">

        <!-- ──────────────────────────────────────────────────────
             CUBO
             ──────────────────────────────────────────────────────
             Propiedad geométrica: 6 caras cuadradas congruentes,
             12 aristas de igual longitud, 8 vértices.
             • <a-box> genera un paralelepípedo; con width=height=depth
               iguales obtenemos un CUBO perfecto (todos los lados = 1).
             • Las aristas se resaltan con un segundo <a-entity> que
               usa la geometría wireframe (wireframe:true) de color
               negro, ligeramente escalado (1.01) para evitar z-fighting.
             • color: rojo (#e63946) para diferenciarlo visualmente.
             • animation: rotación continua Y en 6 s (loop infinito).
        ─────────────────────────────────────────────────────────── -->
        <a-entity id="cubo-wrapper" visible="true">

          <!-- Cara sólida del cubo -->
          <a-box
            id="cubo"
            width="1" height="1" depth="1"
            color="#e63946"
            opacity="0.92"
            metalness="0.1"
            roughness="0.6"
            animation="property: rotation;
                       to: 0 360 0;
                       loop: true;
                       dur: 6000;
                       easing: linear">
          </a-box>

          <!--
            Aristas del cubo (wireframe).
            Se escala a 1.01 para que las líneas sobresalgan
            levemente de la superficie y sean bien visibles.
          -->
          <a-box
            width="1" height="1" depth="1"
            material="color: #1a1a2e; wireframe: true; wireframeLinewidth: 3"
            scale="1.01 1.01 1.01"
            animation="property: rotation;
                       to: 0 360 0;
                       loop: true;
                       dur: 6000;
                       easing: linear">
          </a-box>

        </a-entity>

        <!-- ──────────────────────────────────────────────────────
             ESFERA
             ──────────────────────────────────────────────────────
             Propiedad geométrica: superficie perfectamente redonda
             con simetría radial completa (todos los puntos a igual
             distancia del centro).
             • <a-sphere> con radius uniforme es la representación
               canónica. segmentsWidth y segmentsHeight altos (64)
               dan una superficie lisa (sin facetas angulosas).
             • Wireframe en segundo plano para mostrar la retícula
               latitud/longitud, reforzando el concepto de esfera.
             • color: azul (#2196f3). Rotación continua en eje Y.
        ─────────────────────────────────────────────────────────── -->
        <a-entity id="esfera-wrapper" visible="false">

          <a-sphere
            id="esfera"
            radius="0.6"
            color="#2196f3"
            opacity="0.92"
            segments-width="32"
            segments-height="32"
            metalness="0.15"
            roughness="0.5"
            animation="property: rotation;
                       to: 0 360 0;
                       loop: true;
                       dur: 7000;
                       easing: linear">
          </a-sphere>

          <!-- Retícula meridiana (wireframe) para reforzar la forma esférica -->
          <a-sphere
            radius="0.6"
            segments-width="12"
            segments-height="12"
            material="color: #0d47a1; wireframe: true; wireframeLinewidth: 2"
            scale="1.01 1.01 1.01"
            animation="property: rotation;
                       to: 0 360 0;
                       loop: true;
                       dur: 7000;
                       easing: linear">
          </a-sphere>

        </a-entity>

        <!-- ──────────────────────────────────────────────────────
             CILINDRO CIRCULAR RECTO
             ──────────────────────────────────────────────────────
             Propiedad geométrica escolar:
             • Dos bases CIRCULARES planas, paralelas y congruentes.
             • Superficie lateral curva que las une.
             • El eje (línea que une los centros de ambas bases)
               es PERPENDICULAR a las bases → "circular recto".

             Implementación en A-Frame:
             • <a-cylinder> con radius-top = radius-bottom = 0.45
               garantiza bases circulares congruentes.
             • open-ended="false" cierra ambas tapas (bases).
             • height="1" da igual proporción al radio → cilindro
               armónico para visualización escolar.
             • El eje local Y de <a-cylinder> en A-Frame coincide con
               el eje del cilindro, que al no aplicar rotaciones
               adicionales queda perfectamente VERTICAL (perpendicular
               al plano XZ del marcador) → eje ⊥ bases: RECTO.
             • color: verde (#4caf50).
        ─────────────────────────────────────────────────────────── -->
        <a-entity id="cilindro-wrapper" visible="false">

          <!-- Cuerpo sólido del cilindro -->
          <a-cylinder
            id="cilindro"
            radius="0.45"
            height="1"
            radius-top="0.45"
            radius-bottom="0.45"
            open-ended="false"
            segments-radial="64"
            color="#4caf50"
            opacity="0.92"
            metalness="0.1"
            roughness="0.55"
            animation="property: rotation;
                       to: 0 360 0;
                       loop: true;
                       dur: 6500;
                       easing: linear">
          </a-cylinder>

          <!--
            Aristas del cilindro (wireframe).
            Reducimos segments-radial a 32 para que las líneas sean
            visibles sin generar ruido visual excesivo.
          -->
          <a-cylinder
            radius="0.45"
            height="1"
            radius-top="0.45"
            radius-bottom="0.45"
            open-ended="false"
            segments-radial="16"
            material="color: #1b5e20; wireframe: true; wireframeLinewidth: 2"
            scale="1.01 1.01 1.01"
            animation="property: rotation;
                       to: 0 360 0;
                       loop: true;
                       dur: 6500;
                       easing: linear">
          </a-cylinder>

        </a-entity>

        <!-- ──────────────────────────────────────────────────────
             CONO CIRCULAR RECTO
             ──────────────────────────────────────────────────────
             Propiedad geométrica escolar:
             • Una base CIRCULAR plana.
             • Un vértice (apex) ubicado EXACTAMENTE sobre el centro
               de la base.
             • El eje (segmento del centro de la base al vértice)
               es PERPENDICULAR a la base → "circular recto".

             Implementación en A-Frame:
             • <a-cone> es una especialización de <a-cylinder> donde
               radius-top="0" (el radio superior colapsa en un punto:
               el vértice).
             • radius-bottom="0.55" define la base circular.
             • open-ended="false" cierra la base (tapa plana).
             • Al no aplicar rotaciones extras, el eje Y (de la base
               al vértice) permanece vertical → eje ⊥ base: RECTO.
             • segments-radial="64" → base y superficie laterales
               suaves (circulares, no poligonales).
             • color: naranja (#ff9800).
        ─────────────────────────────────────────────────────────── -->
        <a-entity id="cono-wrapper" visible="false">

          <!-- Cuerpo sólido del cono -->
          <a-cone
            id="cono"
            radius-bottom="0.55"
            radius-top="0"
            height="1.1"
            open-ended="false"
            segments-radial="64"
            color="#ff9800"
            opacity="0.92"
            metalness="0.1"
            roughness="0.55"
            animation="property: rotation;
                       to: 0 360 0;
                       loop: true;
                       dur: 5500;
                       easing: linear">
          </a-cone>

          <!-- Aristas del cono (wireframe) -->
          <a-cone
            radius-bottom="0.55"
            radius-top="0"
            height="1.1"
            open-ended="false"
            segments-radial="16"
            material="color: #e65100; wireframe: true; wireframeLinewidth: 2"
            scale="1.01 1.01 1.01"
            animation="property: rotation;
                       to: 0 360 0;
                       loop: true;
                       dur: 5500;
                       easing: linear">
          </a-cone>

        </a-entity>

      </a-entity>
      <!-- fin grupo-solidos -->

    </a-marker>

    <!-- ════════════════════════════════════════════════════════════
         CÁMARA DE AR.js
         ────────────────────────────────────────────────────────────
         <a-entity camera> con los atributos de AR.js gestiona
         automáticamente la proyección de la cámara real del
         dispositivo sobre la escena 3D.
         look-controls="enabled:false" deshabilita el giro manual
         con ratón/giroscopio para que el marcador sea el único
         sistema de referencia.
    ════════════════════════════════════════════════════════════════ -->
    <a-entity camera look-controls="enabled: false"></a-entity>

  </a-scene>

  <!-- ════════════════════════════════════════════════════════════════
       LÓGICA JAVASCRIPT
       ════════════════════════════════════════════════════════════════ -->
  <script>
    /**
     * ─────────────────────────────────────────────────────────────
     * MAPA DE SÓLIDOS
     * Relaciona el identificador de cada sólido con:
     *   • wrapper: id del <a-entity> contenedor en la escena A-Frame
     *   • label : texto mostrado en el badge superior
     * ─────────────────────────────────────────────────────────────
     */
    const SOLIDOS = {
      cubo:     { wrapper: 'cubo-wrapper',     label: 'CUBO' },
      esfera:   { wrapper: 'esfera-wrapper',   label: 'ESFERA' },
      cilindro: { wrapper: 'cilindro-wrapper', label: 'CILINDRO CIRCULAR RECTO' },
      cono:     { wrapper: 'cono-wrapper',     label: 'CONO CIRCULAR RECTO' },
    };

    /** Sólido actualmente visible */
    let solidoActual = 'cubo';

    /**
     * cambiarSolido(nombre)
     * ─────────────────────────────────────────────────────────────
     * Oculta el sólido actual y muestra el solicitado.
     * La transición es inmediata: solo alterna el atributo
     * visible de cada wrapper. Las animaciones de rotación siguen
     * corriendo en segundo plano (A-Frame las mantiene activas),
     * por lo que al volver a mostrar un sólido ya está girando.
     *
     * @param {string} nombre - Clave del sólido en el objeto SOLIDOS
     */
    function cambiarSolido(nombre) {
      if (nombre === solidoActual) return; // Sin cambio si ya está activo

      // 1. Ocultar el wrapper actual
      const wrapperAnterior = document.getElementById(SOLIDOS[solidoActual].wrapper);
      if (wrapperAnterior) wrapperAnterior.setAttribute('visible', 'false');

      // 2. Mostrar el nuevo wrapper
      const wrapperNuevo = document.getElementById(SOLIDOS[nombre].wrapper);
      if (wrapperNuevo) wrapperNuevo.setAttribute('visible', 'true');

      // 3. Actualizar badge de sólido activo
      const badge = document.getElementById('badge-activo');
      badge.textContent = '▶ ' + SOLIDOS[nombre].label;

      // 4. Actualizar estado CSS de botones (resaltar el activo)
      document.querySelectorAll('.btn-solido').forEach(btn => {
        btn.classList.toggle('activo', btn.dataset.solido === nombre);
      });

      // 5. Guardar nuevo estado
      solidoActual = nombre;
    }
  </script>

</body>
</html>
