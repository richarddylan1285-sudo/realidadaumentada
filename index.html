<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>RA Escolar: Sólidos Geométricos</title>

    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <style>
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
            width: 100%;
            height: 100%;
        }

        /* Contenedor del Menú Flotante */
        #menu-container {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999; /* Obliga a la UI a estar por encima del video de la cámara */
            width: 90%;
            max-width: 500px;
            background: rgba(25, 25, 25, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 12px;
            box-sizing: border-box;
            display: flex;
            flex-direction: row;
            gap: 10px;
            overflow-x: auto; 
            overflow-y: hidden;
            white-space: nowrap;
            -webkit-overflow-scrolling: touch;
        }

        .btn-solido {
            background: linear-gradient(135deg, #2c3e50, #3498db);
            color: #ffffff;
            border: none;
            padding: 12px 20px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            flex: 0 0 auto;
            min-width: 100px;
            text-align: center;
        }

        .btn-solido.active {
            background: linear-gradient(135deg, #e74c3c, #f1c40f);
        }
    </style>
</head>

<body style="margin: 0px; overflow: hidden;">

    <div id="menu-container">
        <button class="btn-solido active" onclick="cambiarSolido('cubo')">Cubo</button>
        <button class="btn-solido" onclick="cambiarSolido('esfera')">Esfera</button>
        <button class="btn-solido" onclick="cambiarSolido('cilindro')">Cilindro</button>
        <button class="btn-solido" onclick="cambiarSolido('cono')">Cono</button>
    </div>

    <a-scene embedded 
             arjs="sourceType: webcam; sourceWidth:1280; sourceHeight:720; displayWidth: 1280; displayHeight: 720; debugUIEnabled: false;" 
             vr-mode-ui="enabled: false">
        
        <a-marker preset="hiro">
            <a-entity id="grupo-rotacion" animation="property: rotation; to: 0 360 0; loop: true; dur: 8000; easing: linear">
                
                <a-entity id="cubo" visible="true">
                    <a-box position="0 0.5 0" scale="0.4 0.4 0.4" color="#00C853">
                        <a-box scale="1.01 1.01 1.01" material="wireframe: true; wireframeLineWidth: 3; color: #FFFFFF"></a-box>
                    </a-box>
                </a-entity>

                <a-entity id="esfera" visible="false">
                    <a-sphere position="0 0.5 0" radius="0.25" color="#FFea00">
                        <a-sphere radius="0.251" material="wireframe: true; wireframeLineWidth: 1.5; color: #000000"></a-sphere>
                    </a-sphere>
                </a-entity>

                <a-entity id="cilindro" visible="false">
                    <a-cylinder position="0 0.5 0" radius="0.2" height="0.5" color="#00B0FF">
                        <a-cylinder radius="0.201" height="0.501" material="wireframe: true; wireframeLineWidth: 2; color: #FFFFFF"></a-cylinder>
                    </a-cylinder>
                </a-entity>

                <a-entity id="cono" visible="false">
                    <a-cone position="0 0.5 0" radius-bottom="0.25" radius-top="0" height="0.5" color="#AA00FF">
                        <a-cone radius-bottom="0.251" radius-top="0" height="0.501" material="wireframe: true; wireframeLineWidth: 2; color: #FFFFFF"></a-cone>
                    </a-cone>
                </a-entity>

            </a-entity>
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>

    <script>
        const solidosIds = ['cubo', 'esfera', 'cilindro', 'cono'];

        function cambiarSolido(idSeleccionado) {
            solidosIds.forEach(id => {
                const elemento = document.getElementById(id);
                if (elemento) {
                    elemento.setAttribute('visible', id === idSeleccionado ? 'true' : 'false');
                }
            });

            const botones = document.querySelectorAll('.btn-solido');
            botones.forEach(boton => {
                boton.classList.remove('active');
                if (boton.getAttribute('onclick').includes(idSeleccionado)) {
                    boton.classList.add('active');
                    boton.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                }
            });
        }

        // CONTROL DE SEGURIDAD EXTRÉMULO PARA LA CÁMARA
        // Algunos navegadores móviles bloquean el video si el usuario no interactúa primero.
        window.addEventListener('click', () => {
            const video = document.querySelector('video');
            if (video && video.paused) {
                video.play().catch(err => console.log("Esperando interacción para reproducir video"));
            }
        });
    </script>
</body>
</html>
