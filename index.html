<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>RA — Sólidos Geométricos</title>

  <!--
    ============================================================
    LIBRERÍAS PRINCIPALES
    A-Frame: motor de escenas 3D declarativo en HTML
    AR.js:   módulo de Realidad Aumentada para A-Frame
             usa marcadores Artoolkit (hiro, kanji, etc.)
    ============================================================
  -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    /* ── Reset general ── */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', sans-serif;
      overflow: hidden;           /* La cámara ocupa todo el viewport */
      background: #000;
    }

    /* ────────────────────────────────────────────────────────
       MENÚ FLOTANTE
       Posicionado con z-index alto para quedar encima del canvas
       de A-Frame sin interferir con el tracking del marcador.
    ──────────────────────────────────────────────────────── */
    #menu {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;               /* Siempre sobre la escena AR */
      display: flex;
      gap: 10px;
      background: rgba(10, 10, 30, 0.72);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 60px;
      padding: 10px 18px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.55);
    }

    /* Cada botón del menú */
    .btn-solido {
      cursor: pointer;
      border: none;
      border-radius: 50px;
      padding: 9px 20px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #fff;
      background: rgba(255,255,255,0.1);
      transition: background 0.22s, transform 0.15s, box-shadow 0.2s;
    }

    /* Estado activo (figura actualmente visible) */
    .btn-solido.activo {
      background: linear-gradient(135deg, #7c3aed, #2563eb);
      box-shadow: 0 0 18px rgba(124, 58, 237, 0.6);
      transform: scale(1.07);
    }

    .btn-solido:hover:not(.activo) {
      background: rgba(255,255,255,0.22);
      transform: scale(1.04);
    }

    /* ── Etiqueta informativa superior ── */
    #etiqueta {
      position: fixed;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      background: rgba(10, 10, 30, 0.72);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 50px;
      padding: 7px 22px;
      color: #e2e8f0;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.03em;
      pointer-events: none;       /* No bloquea la cámara AR */
    }

    #etiqueta span {
      color: #a78bfa;
      font-weight: 700;
    }
  </style>
</head>

<body>

  <!-- ── Etiqueta superior ── -->
  <div id="etiqueta">Apunta al marcador <span>HIRO</span> · Elige un sólido</div>

  <!-- ────────────────────────────────────────────────────────
       MENÚ DE SELECCIÓN DE SÓLIDOS
       Cada botón llama a mostrarSolido('id') con el id del
       objeto A-Frame que queremos mostrar.
  ──────────────────────────────────────────────────────── -->
  <div id="menu">
    <button class="btn-solido activo" onclick="mostrarSolido('cubo')">🟦 Cubo</button>
    <button class="btn-solido"       onclick="mostrarSolido('esfera')">🔵 Esfera</button>
    <button class="btn-solido"       onclick="mostrarSolido('cilindro')">🟥 Cilindro</button>
    <button class="btn-solido"       onclick="mostrarSolido('cono')">🔺 Cono</button>
    <button class="btn-solido"       onclick="mostrarSolido('piramide')">🔶 Pirámide</button>
  </div>

  <!-- ====================================================
       ESCENA A-FRAME + AR.js
       ·  embedded            → ocupa el 100% del viewport
       ·  arjs="sourceType:   webcam" → usa la cámara del dispositivo
       ·  detectionMode       → detección mono + matrices (más estable)
       ·  cameraParametersUrl → parámetros de calibración por defecto
       ·  trackingMethod      → 'best' para desktop y móvil
  ===================================================== -->
  <a-scene
    embedded
    arjs="sourceType: webcam;
          detectionMode: mono_and_matrix;
          cameraParametersUrl: https://raw.githack.com/AR-js-org/AR.js/master/data/data/camera_para.dat;
          trackingMethod: best;
          debugUIEnabled: false;"
    renderer="antialias: true; alpha: true;"
    vr-mode-ui="enabled: false"
  >

    <!-- ──────────────────────────────────────────────────
         ASSETS: precargamos materiales/colores reutilizables
         (No es obligatorio, pero mejora el rendimiento.)
    ────────────────────────────────────────────────── -->
    <a-assets></a-assets>

    <!-- ══════════════════════════════════════════════════
         MARCADOR HIRO
         Todo lo que se coloque DENTRO de <a-marker> aparece
         encima del marcador físico cuando la cámara lo detecta.
    ══════════════════════════════════════════════════ -->
    <a-marker preset="hiro">

      <!--
        ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        REGLA DE ESCALA ESCOLAR
        scale="0.4" → los sólidos miden ~40% del marcador,
        así caben bien sobre una hoja A4 impresa en clase.
        position="0 0.25 0" → levita ligeramente sobre el papel.
        ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      -->

      <!-- ── 1. CUBO ─────────────────────────────────────
           Sólido platónico clásico: 6 caras cuadradas iguales,
           12 aristas y 8 vértices. Color azul eléctrico.
           wireframe: true → muestra aristas (fundamental en clase).
      ─────────────────────────────────────────────── -->
      <a-entity id="cubo" position="0 0.25 0" scale="0.4 0.4 0.4"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 5000; easing: linear">
        <!-- Cara sólida semitransparente -->
        <a-box
          color="#2563eb"
          opacity="0.82"
          roughness="0.3"
          metalness="0.1">
        </a-box>
        <!-- Aristas visibles con wireframe -->
        <a-box
          color="#ffffff"
          opacity="1"
          material="wireframe: true; wireframeLinewidth: 3">
        </a-box>
      </a-entity>

      <!-- ── 2. ESFERA ───────────────────────────────────
           Simetría radial perfecta: todos los puntos de la
           superficie equidistan del centro. Color magenta.
           segments-height/width altos → superficie suave.
      ─────────────────────────────────────────────── -->
      <a-entity id="esfera" position="0 0.25 0" scale="0.4 0.4 0.4" visible="false"
        animation="property: rotation; to: 0 360 20; loop: true; dur: 6000; easing: linear">
        <a-sphere
          color="#db2777"
          opacity="0.82"
          segments-height="18"
          segments-width="18"
          roughness="0.2"
          metalness="0.2">
        </a-sphere>
        <!-- Líneas de latitud/longitud → alambre visible -->
        <a-sphere
          color="#ffffff"
          opacity="0.9"
          segments-height="8"
          segments-width="8"
          material="wireframe: true; wireframeLinewidth: 2">
        </a-sphere>
      </a-entity>

      <!-- ── 3. CILINDRO ────────────────────────────────
           Dos bases circulares planas y paralelas unidas
           por una superficie lateral recta. Color naranja.
           radius-top = radius-bottom → cilindro recto.
      ─────────────────────────────────────────────── -->
      <!-- Cilindro: bajo y ancho (height < radius*2) → silueta
           "moneda gruesa", opuesta al cono que es alto y puntiagudo.
           Inclinado 20° para que ambas bases circulares se vean. -->
      <a-entity id="cilindro" position="0 0.2 0" scale="0.45 0.45 0.45" visible="false"
        animation="property: rotation; from: 20 0 0; to: 20 360 0; loop: true; dur: 5500; easing: linear">
        <a-cylinder
          color="#ea580c"
          opacity="0.85"
          radius-top="0.6"
          radius-bottom="0.6"
          height="0.75"
          segments-radial="32"
          open-ended="false"
          roughness="0.25">
        </a-cylinder>
        <a-cylinder
          color="#ffffff"
          opacity="1"
          radius-top="0.6"
          radius-bottom="0.6"
          height="0.75"
          segments-radial="16"
          material="wireframe: true; wireframeLinewidth: 2">
        </a-cylinder>
      </a-entity>

      <!-- ── 4. CONO ─────────────────────────────────────
           Base circular amplia (0.7) + ápice puntudo arriba.
           Usa <a-cone>, primitiva nativa de A-Frame, con
           height="1.4" para que la silueta sea inconfundible
           vs el cilindro (que es bajo y simétrico).
           La rotación inclinada (15°) expone la base circular.
      ─────────────────────────────────────────────── -->
      <a-entity id="cono" position="0 0.3 0" scale="0.45 0.45 0.45" visible="false"
        animation="property: rotation; from: 15 0 0; to: 15 360 0; loop: true; dur: 5000; easing: linear">
        <!-- Cuerpo sólido con base ancha y punta alta -->
        <a-cone
          color="#16a34a"
          opacity="0.85"
          radius-bottom="0.7"
          radius-top="0.01"
          height="1.5"
          segments-radial="32"
          roughness="0.25">
        </a-cone>
        <!-- Aristas (generatrices) del cono -->
        <a-cone
          color="#ffffff"
          opacity="1"
          radius-bottom="0.7"
          radius-top="0.01"
          height="1.5"
          segments-radial="12"
          material="wireframe: true; wireframeLinewidth: 2">
        </a-cone>
      </a-entity>

      <!-- ── 5. PIRÁMIDE ────────────────────────────────
           Base cuadrada + 4 caras triangulares que convergen
           en un vértice. Construida con a-cone de 4 lados.
           Color dorado. segments-radial="4" = base cuadrada.
      ─────────────────────────────────────────────── -->
      <a-entity id="piramide" position="0 0.22 0" scale="0.4 0.4 0.4" visible="false"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 5500; easing: linear">
        <a-cylinder
          color="#d97706"
          opacity="0.82"
          radius-top="0"
          radius-bottom="0.55"
          height="1"
          segments-radial="4"
          roughness="0.2">
        </a-cylinder>
        <a-cylinder
          color="#ffffff"
          opacity="0.9"
          radius-top="0"
          radius-bottom="0.55"
          height="1"
          segments-radial="4"
          material="wireframe: true; wireframeLinewidth: 3">
        </a-cylinder>
      </a-entity>

    </a-marker><!-- /a-marker hiro -->

    <!-- ── Cámara AR ──────────────────────────────────────
         look-controls-enabled: false → evita que el usuario
         mueva la cámara con el ratón (modo AR puro).
         user-height: 0 → no ajusta la altura como en VR.
    ─────────────────────────────────────────────── -->
    <a-entity camera look-controls-enabled="false" user-height="0"></a-entity>

  </a-scene><!-- /a-scene -->


  <!-- ====================================================
       JAVASCRIPT — LÓGICA DE CAMBIO DE SÓLIDOS
       Función central: mostrarSolido(idSolido)
       1. Recorre el array de IDs conocidos.
       2. Oculta todos excepto el seleccionado (visible="false").
       3. Actualiza el estilo activo de los botones del menú.
  ===================================================== -->
  <script>
    // Lista de todos los IDs de sólidos presentes en la escena
    const SOLIDOS = ['cubo', 'esfera', 'cilindro', 'cono', 'piramide'];

    /**
     * mostrarSolido(idSolido)
     * ──────────────────────
     * Oculta todos los sólidos y muestra únicamente el solicitado.
     * También actualiza la clase CSS "activo" en los botones del menú.
     *
     * @param {string} idSolido — ID del elemento A-Frame a mostrar
     */
    function mostrarSolido(idSolido) {
      // ── 1. Alternar visibilidad en la escena 3D ──
      SOLIDOS.forEach(id => {
        const entidad = document.getElementById(id);
        if (entidad) {
          // setAttribute de A-Frame actualiza el componente AR correctamente
          entidad.setAttribute('visible', id === idSolido);
        }
      });

      // ── 2. Actualizar botones del menú HTML ──
      document.querySelectorAll('.btn-solido').forEach(btn => {
        // El texto del botón contiene el nombre del sólido en minúscula
        // Comparamos el onclick con el id para identificar el botón activo
        const esActivo = btn.getAttribute('onclick').includes(`'${idSolido}'`);
        btn.classList.toggle('activo', esActivo);
      });
    }
  </script>

</body>
</html>
