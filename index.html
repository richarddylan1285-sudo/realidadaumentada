<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>RA Escolar: Sólidos Geométricos</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/aframe/1.2.0/aframe.min.js"></script>
    <script src="https://unpkg.com/@ar-js-org/ar.js@3.3.2/aframe/build/aframe-ar.js"></script>

    <style>
        /* Estilos generales para asegurar que la cámara ocupe toda la pantalla */
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        /* ---------------------------------------------------------------------- */
        /* INTERFAZ DE USUARIO (UI) RESPONSIVA CON SCROLL AUTOMÁTICO              */
        /* ---------------------------------------------------------------------- */
        #menu-container {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 400px; /* Evita que ocupe demasiado espacio en pantallas grandes */
            max-height: 25vh;  /* Limita la altura al 25% de la pantalla para no tapar la RA */
            background: rgba(25da, 255, 255, 0.85);
            backdrop-filter: blur(8px); /* Efecto moderno de desenfoque de fondo */
            border-radius: 15px;
            padding: 12px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            z-index: 9999; /* Asegura que la UI se renderice SIEMPRE por encima de la cámara */
            box-sizing: border-box;
            border: 2px solid rgba(255, 255, 255, 0.5);
            
            /* REQUISITO DE SCROLL: Habilita scroll vertical si el contenido excede la altura máxima */
            overflow-y: auto; 
            -webkit-overflow-scrolling: touch; /* Scroll suave garantizado en iOS */
        }

        /* Título del menú educativo */
        .menu-title {
            text-align: center;
            margin: 0 0 8px 0;
            font-size: 14px;
            font-weight: bold;
            color: #2c3e50;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Contenedor tipo Grid para los botones (fácilmente escalable si añades más sólidos) */
        .grid-botones {
            display: grid;
            grid-template-columns: repeat(2, 1fr); /* 2 columnas simétricas */
            gap: 8px;
        }

        /* Estilo base de los botones interactivos táctiles */
        .btn-solido {
            background-color: #34495e;
            color: white;
            border: none;
            padding: 12px 8px; /* Tamaño optimizado para interacción táctil (mínimo 44px de alto) */
            font-size: 13px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }

        /* Efecto feedback visual al seleccionar o pasar el cursor */
        .btn-solido:active, .btn-solido.active {
            background-color: #2ecc71; /* Verde pedagógico de "activo" */
            transform: scale(0.95);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
        }

        /* Personalización de la barra de desplazamiento (Scrollbar) para que sea discreta */
        #menu-container::-webkit-scrollbar {
            width: 6px;
        }
        #menu-container::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 4px;
        }
    </style>
</head>

<body>

    <div id="menu-container">
        <div class="menu-title">Sólidos Geométricos</div>
        <div class="grid-botones">
            <button class="btn-solido active" onclick="cambiarSolido('cubo')">Cubo</button>
            <button class="btn-solido" onclick="cambiarSolido('esfera')">Esfera</button>
            <button class="btn-solido" onclick="cambiarSolido('cilindro')">Cilindro R.</button>
            <button class="btn-solido" onclick="cambiarSolido('cono')">Cono R.</button>
        </div>
    </div>

    <a-scene embedded 
             arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
             renderer="logarithmicDepthBuffer: true; antialias: true;">
        
        <a-marker preset="hiro" id="marcador-escolar">
            
            <a-entity id="contenedor-solidos" 
                      position="0 0.5 0" 
                      scale="0.4 0.4 0.4"
                      animation="property: rotation; to: 0 360 0; loop: true; dur: 8000; easing: linear">
                
                <a-entity id="cubo" visible="true">
                    <a-box width="1.2" height="1.2" depth="1.2" color="#e74c3c" material="opacity: 0.85; transparent: true; roughness: 0.3;"></a-box>
                    <a-box width="1.2" height="1.2" depth="1.2" wireframe="true" wireframe-linewidth="3" color="#ffffff"></a-box>
                </a-entity>

                <a-entity id="esfera" visible="false">
                    <a-sphere radius="0.7" segments-width="32" segments-height="32" color="#3498db" material="opacity: 0.85; transparent: true; roughness: 0.3;"></a-sphere>
                    <a-sphere radius="0.7" segments-width="16" segments-height="16" wireframe="true" wireframe-linewidth="2" color="#ffffff"></a-sphere>
                </a-entity>

                <a-entity id="cilindro" visible="false">
                    <a-cylinder radius="0.6" height="1.4" segments-radial="32" color="#f1c40f" material="opacity: 0.85; transparent: true; roughness: 0.3;"></a-cylinder>
                    <a-cylinder radius="0.6" height="1.4" segments-radial="16" wireframe="true" wireframe-linewidth="2" color="#ffffff"></a-cylinder>
                </a-entity>

                <a-entity id="cono" visible="false">
                    <a-cone radius-bottom="0.7" height="1.5" segments-radial="32" color="#9b59b6" material="opacity: 0.85; transparent: true; roughness: 0.3;"></a-cone>
                    <a-cone radius-bottom="0.7" height="1.5" segments-radial="16" wireframe="true" wireframe-linewidth="2" color="#ffffff"></a-cyan-cone>
                </a-entity>

            </a-entity>
            
        </a-marker>

        <a-entity camera arjs-look-controls></a-entity>
    </a-scene>

    <script>
        // Diccionario con las referencias de los ID del DOM de A-Frame
        const solidos = {
            cubo: document.getElementById('cubo'),
            esfera: document.getElementById('esfera'),
            cilindro: document.getElementById('cilindro'),
            cono: document.getElementById('cono')
        };

        /**
         * Maneja la alternancia de visibilidad de las figuras geométricas.
         * Garantiza una transición inmediata donde solo un sólido es visible a la vez.
         * @param {string} idSeleccionado - El nombre clave del sólido a mostrar.
         */
        function cambiarSolido(idSeleccionado) {
            // 1. Recorrer todos los elementos del diccionario e inyectar el estado de visibilidad
            for (const key in solidos) {
                if (solidos.hasOwnProperty(key)) {
                    if (key === idSeleccionado) {
                        solidos[key].setAttribute('visible', 'true');
                    } else {
                        solidos[key].setAttribute('visible', 'false');
                    }
                }
            }

            // 2. Actualizar visualmente la UI de los botones para dar feedback táctil
            const botones = document.querySelectorAll('.btn-solido');
            botones.forEach(boton => {
                boton.classList.remove('active');
                // Si la función onclick del botón contiene la cadena del ID, se activa
                if (boton.getAttribute('onclick').includes(idSeleccionado)) {
                    boton.classList.add('active');
                }
            });
        }
    </script>
</body>
</html>
